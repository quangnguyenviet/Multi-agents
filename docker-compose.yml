# MinIO cho skill storage.
# Backend (python server.py) chạy riêng trên host, kết nối tới localhost:9000.
# Credentials & port khớp với backend/.env (minioadmin / minioadmin).
#
# Dùng:  docker compose up -d   → MinIO + tự tạo bucket "skills" + upload seed *.md
#        Console:  http://localhost:9001  (minioadmin / minioadmin)

services:
  minio:
    image: minio/minio:latest
    container_name: evo-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API (backend dùng cổng này — MINIO_ENDPOINT=localhost:9000)
      - "9001:9001"   # Web Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    restart: unless-stopped

  # One-shot: chờ MinIO sẵn sàng, tạo bucket "skills", upload seed skills/library/*.md
  minio-init:
    image: minio/mc:latest
    container_name: evo-minio-init
    depends_on:
      - minio
    volumes:
      - ./backend/skills/library:/seed:ro
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do
        echo 'Cho MinIO san sang...'; sleep 2;
      done;
      mc mb --ignore-existing local/skills;
      mc cp --recursive /seed/ local/skills/;
      echo '--- Objects trong bucket skills: ---';
      mc ls local/skills;
      "
    restart: "no"

  # ── Production backends (chỉ chạy khi: docker compose --profile prod up -d) ──
  # Khớp DATABASE_URL=postgresql://evo:evo@localhost:5432/evo và REDIS_URL=redis://localhost:6379/0
  postgres:
    image: postgres:16-alpine
    container_name: evo-postgres
    profiles: ["prod"]
    environment:
      POSTGRES_USER: evo
      POSTGRES_PASSWORD: evo
      POSTGRES_DB: evo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: evo-redis
    profiles: ["prod"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  minio_data:
  postgres_data:
  redis_data:
